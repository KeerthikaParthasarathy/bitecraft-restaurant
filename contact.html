<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BITECRAFT | Book a Table & Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased">

  <header class="sticky top-0 bg-[#FBF8F2]/95 backdrop-blur z-50 border-b border-[#521C0E]/10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl sm:text-3xl font-black tracking-widest text-[#521C0E]">BITECRAFT</a>
      <nav class="hidden lg:flex items-center space-x-8 text-sm font-bold text-[#521C0E]/80">
        <a href="index.html" class="hover:text-[#B93815] transition">Home</a>
        <a href="menu.html" class="hover:text-[#B93815] transition">Menus</a>
        <a href="about.html" class="hover:text-[#B93815] transition">About</a>
        <a href="gallery.html" class="hover:text-[#B93815] transition">Gallery</a>
        <a href="contact.html" class="text-[#B93815] border-b-2 border-[#B93815] pb-1">Contact</a>
      </nav>
      <a href="contact.html" class="bg-[#E59819] hover:bg-[#cf860e] text-white px-6 py-2.5 rounded-full font-black text-xs tracking-wider shadow">
        BOOK A TABLE
      </a>
    </div>
  </header>

  <!-- Reservation Box with slow zoom-in -->
  <section class="max-w-4xl mx-auto px-6 py-16">
    <div data-aos="zoom-in" data-aos-duration="1300" class="bg-white rounded-3xl p-8 sm:p-12 shadow-xl border border-[#521C0E]/10">
      <div class="text-center mb-8">
        <span class="text-xs font-black uppercase tracking-widest text-[#B93815]">Reservation</span>
        <h2 class="text-3xl sm:text-4xl font-black text-[#521C0E] uppercase mt-1">Book Your Table</h2>
        <p class="text-xs text-gray-500 mt-2">Reserve a dining table with zero waiting time.</p>
      </div>

      <form onsubmit="event.preventDefault(); alert('Table booked successfully!');" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-[#521C0E] mb-1">Full Name</label>
            <input type="text" required placeholder="John Doe" class="w-full bg-[#FBF8F2] border border-gray-200 rounded-xl px-4 py-2.5 text-xs outline-none focus:border-[#E59819]">
          </div>
          <div>
            <label class="block text-xs font-bold text-[#521C0E] mb-1">Phone Number</label>
            <input type="tel" required placeholder="+1 234 567 890" class="w-full bg-[#FBF8F2] border border-gray-200 rounded-xl px-4 py-2.5 text-xs outline-none focus:border-[#E59819]">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-[#521C0E] mb-1">Date</label>
            <input type="date" required class="w-full bg-[#FBF8F2] border border-gray-200 rounded-xl px-4 py-2.5 text-xs outline-none focus:border-[#E59819]">
          </div>
          <div>
            <label class="block text-xs font-bold text-[#521C0E] mb-1">Time</label>
            <input type="time" required class="w-full bg-[#FBF8F2] border border-gray-200 rounded-xl px-4 py-2.5 text-xs outline-none focus:border-[#E59819]">
          </div>
          <div>
            <label class="block text-xs font-bold text-[#521C0E] mb-1">Guests</label>
            <select class="w-full bg-[#FBF8F2] border border-gray-200 rounded-xl px-4 py-2.5 text-xs outline-none focus:border-[#E59819]">
              <option>2 Persons</option>
              <option>4 Persons</option>
              <option>6+ Persons</option>
            </select>
          </div>
        </div>

        <button type="submit" class="w-full bg-[#521C0E] hover:bg-[#3d1309] text-white py-3 rounded-full font-black text-xs uppercase tracking-wider shadow transition mt-4">
          Confirm Reservation
        </button>
      </form>
    </div>
  </section>

  <footer class="bg-[#521C0E] text-white py-10 mt-10">
    <div class="max-w-7xl mx-auto px-6 text-center space-y-4">
      <h3 class="text-3xl font-black tracking-widest text-[#E59819]">BITECRAFT</h3>
      <p class="text-[11px] text-gray-400">© 2026 BITECRAFT. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ once: true, easing: 'ease-out-cubic' });
  </script>
</body>
</html>
